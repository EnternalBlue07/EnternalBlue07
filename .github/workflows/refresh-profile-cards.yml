name: Refresh profile cards

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/render_profile_cards.py'
      - '.github/workflows/refresh-profile-cards.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render contribution and project cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile_cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile cards"
            git push
          else
            echo "Profile cards are already up to date."
          fi
