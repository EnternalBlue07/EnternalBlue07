name: Refresh profile engineering and activity cards

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/render_profile_visuals.py"
      - "scripts/render_blue_heatmap.py"
      - "cards/hero-ascii.svg.gz.b64"
      - ".github/workflows/refresh-profile-visuals.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install personal ASCII hero from compressed source
        if: hashFiles('cards/hero-ascii.svg.gz.b64') != ''
        run: |
          base64 --decode cards/hero-ascii.svg.gz.b64 | gzip --decompress > cards/hero-ascii.svg
          rm cards/hero-ascii.svg.gz.b64

      - name: Render cards from GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile_visuals.py

      - name: Render animated blue contribution heatmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_blue_heatmap.py

      - name: Commit refreshed SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards/hero-ascii.svg cards/hero-ascii.svg.gz.b64 cards/engineering-intent.svg cards/contribution-activity.svg cards/heatmap.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh engineering and activity cards"
            git push
          else
            echo "Cards are already up to date."
          fi
