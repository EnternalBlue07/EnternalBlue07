<text x="52" y="47" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17191E">Creative by nature</text>
<text x="28" y="91" font-family="Arial, sans-serif" font-size="14.5" fill="#444851">I experiment, challenge assumptions,</text>
