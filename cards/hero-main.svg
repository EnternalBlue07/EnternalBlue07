<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="222" viewBox="0 0 1080 222" role="img" aria-label="Software engineer in the making, AI builder, systems thinker. Code plus AI plus Cloud.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1421"/>
    <stop offset=".52" stop-color="#0D1117"/>
    <stop offset="1" stop-color="#101B2A"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#60A5FA"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#0891B2" stop-opacity=".25"/>
    <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#38BDF8" opacity=".13"/>
  </pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1080" height="222" rx="18" fill="url(#bg)"/>
<rect width="1080" height="222" rx="18" fill="url(#grid)"/>
<ellipse cx="540" cy="152" rx="330" ry="102" fill="url(#glow)"/>
<rect x="142" y="22" width="796" height="42" rx="21" fill="#09121E" stroke="#155E75" stroke-width="1"/>
<circle cx="172" cy="43" r="3.5" fill="#22D3EE"/>
<circle cx="908" cy="43" r="3.5" fill="#60A5FA"/>
<text x="540" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8" fill="#DCEFF7">SOFTWARE ENGINEER IN THE MAKING  ·  AI BUILDER  ·  SYSTEMS THINKER</text>
<ellipse cx="540" cy="139" rx="250" ry="37" fill="none" stroke="#0E7490" stroke-opacity=".42" stroke-width="1.4"/>
<ellipse cx="540" cy="139" rx="250" ry="37" fill="none" stroke="#22D3EE" stroke-opacity=".12" stroke-width="5" filter="url(#soft)"/>
<text x="540" y="157" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="48" font-weight="700" letter-spacing="1" fill="#F8FAFC">Code <tspan fill="#9CA3AF">+</tspan> <tspan fill="url(#cyan)">AI</tspan> <tspan fill="#9CA3AF">+</tspan> <tspan fill="url(#cyan)">Cloud.</tspan></text>
<rect x="422" y="183" width="236" height="2.5" rx="1.25" fill="url(#cyan)"/>
